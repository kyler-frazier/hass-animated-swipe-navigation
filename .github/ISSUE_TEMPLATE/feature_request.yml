name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        This plugin aims to stay small and focused, so not every idea will fit. Explaining the
        problem you want solved helps most, even if there's a better solution than the one you
        have in mind.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: >-
            I searched [existing issues](https://github.com/kyler-frazier/hass-animated-swipe-navigation/issues?q=is%3Aissue),
            including closed ones, and this hasn't been suggested.
          required: true
        - label: This request covers a single idea.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation and why the current behavior falls short.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you'd like it to work, including any configuration it would need.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - "No"
        - Yes, with some guidance
        - Yes, I can open a pull request
    validations:
      required: true
  - type: checkboxes
    id: ai
    attributes:
      label: AI assistance
      description: >-
        See [our AI policy](https://github.com/kyler-frazier/hass-animated-swipe-navigation/blob/main/CONTRIBUTING.md#using-ai-tools).
      options:
        - label: If I used AI to help write this, I reviewed and edited it.
          required: true
